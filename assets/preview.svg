  </defs>
  <rect width="1120" height="560" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1117" height="557" rx="20.5" fill="none" stroke="#2f3843" stroke-width="2"/>

  <!-- Header -->
