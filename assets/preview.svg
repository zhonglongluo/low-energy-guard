<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13171b"/>
      <stop offset="100%" stop-color="#1a2127"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7db4a6"/>
      <stop offset="100%" stop-color="#5a9b8b"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="580" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1117" height="577" rx="20.5" fill="none" stroke="#2f3843" stroke-width="2"/>

  <!-- Topbar -->
  <rect x="36" y="26" width="46" height="46" rx="12" fill="#20332f" stroke="#7db4a6" stroke-width="1.5"/>
  <text x="59" y="57" text-anchor="middle" font-size="22" font-family="-apple-system, sans-serif">🛡️</text>
  <text x="96" y="47" fill="#eef1ec" font-size="22" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">Low-Energy-Guard</text>
  <text x="96" y="68" fill="#98a3ad" font-size="13" font-family="-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif">Not a hustle productivity app — a local-first guardian for sleep, energy, emotions &amp; gentle pacing</text>
  <rect x="854" y="32" width="96" height="34" rx="10" fill="#242b33" stroke="#2f3843"/>
  <text x="902" y="54" text-anchor="middle" fill="#eef1ec" font-size="12" font-family="-apple-system, sans-serif">EN / 中文</text>
  <rect x="960" y="32" width="124" height="34" rx="10" fill="url(#accent)"/>
  <text x="1022" y="54" text-anchor="middle" fill="#0f211c" font-size="12" font-weight="700" font-family="-apple-system, sans-serif">📝 Obsidian .md</text>

  <!-- Hero: Low-Energy Guidance Engine -->
  <rect x="36" y="90" width="1048" height="122" rx="16" fill="#1d2729" stroke="#5a9b8b" stroke-width="1.5"/>
  <text x="58" y="120" fill="#a9dfd0" font-size="15.5" font-weight="700" font-family="-apple-system, sans-serif">🧭 Low-Energy Guidance Engine · Zero Toxic Productivity</text>
  <rect x="884" y="102" width="178" height="24" rx="12" fill="#3a2f1d" stroke="#e69f44"/>
  <text x="973" y="118" text-anchor="middle" fill="#ffd08a" font-size="11.5" font-weight="600" font-family="-apple-system, sans-serif">🌿 Low-Energy Protection</text>
  <text x="58" y="148" fill="#eef1ec" font-size="14" font-family="-apple-system, sans-serif">"Sleep was 5.8h &amp; energy is 4/12 spoons. Skip self-criticism today — do just 1 tiny baseline win and prioritize early rest."</text>
  <rect x="58" y="164" width="490" height="34" rx="8" fill="#213431" stroke="#5a9b8b"/>
  <text x="72" y="185" fill="#a9dfd0" font-size="12" font-family="-apple-system, sans-serif">✓ Today's Safe Focus: 1 tiny 1-spoon task + warm water + 15-min rest</text>
  <rect x="562" y="164" width="500" height="34" rx="8" fill="#242b33" stroke="#37424f"/>
  <text x="576" y="185" fill="#d3dce4" font-size="12" font-family="-apple-system, sans-serif">🛑 Permission to Pause: Heavy deep work, late-night review &amp; self-blame</text>

  <!-- 4 Core Pillar Cards -->
  <rect x="36" y="232" width="514" height="154" rx="14" fill="#1c2227" stroke="#2f3843"/>
  <text x="58" y="264" fill="#eef1ec" font-size="15.5" font-weight="700" font-family="-apple-system, sans-serif">1. 🥄 Spoon Energy Management</text>
  <text x="58" y="290" fill="#98a3ad" font-size="12.5" font-family="-apple-system, sans-serif">• Track 1–12 daily spoons + recharge actions (+1 / +2)</text>
  <text x="58" y="314" fill="#98a3ad" font-size="12.5" font-family="-apple-system, sans-serif">• Auto-filter tasks by energy cost so overload vanishes</text>
  <text x="58" y="338" fill="#98a3ad" font-size="12.5" font-family="-apple-system, sans-serif">• "Just One Thing" picker + 5-min gentle starter timer</text>
  <text x="58" y="366" fill="#7db4a6" font-size="11.5" font-family="-apple-system, sans-serif">Decide what you can do today — and what deserves rest.</text>

  <rect x="570" y="232" width="514" height="154" rx="14" fill="#1c2227" stroke="#2f3843"/>
  <text x="592" y="264" fill="#eef1ec" font-size="15.5" font-weight="700" font-family="-apple-system, sans-serif">2. 🌙 Sleep &amp; Rest Guardian</text>
  <text x="592" y="290" fill="#98a3ad" font-size="12.5" font-family="-apple-system, sans-serif">• Log bedtime, wake time (auto duration) &amp; sleep quality (1–5)</text>
  <text x="592" y="314" fill="#98a3ad" font-size="12.5" font-family="-apple-system, sans-serif">• Overdraft alert when sleep drops below your baseline</text>
  <text x="592" y="338" fill="#98a3ad" font-size="12.5" font-family="-apple-system, sans-serif">• 7-day Sleep × Spoons dual rhythm SVG chart</text>
  <text x="592" y="366" fill="#7db4a6" font-size="11.5" font-family="-apple-system, sans-serif">Core anchor metric feeding the Guidance Engine.</text>

  <rect x="36" y="402" width="514" height="148" rx="14" fill="#1c2227" stroke="#2f3843"/>
  <text x="58" y="434" fill="#eef1ec" font-size="15.5" font-weight="700" font-family="-apple-system, sans-serif">3. 🫧 Emotion &amp; Rumination Pause</text>
  <text x="58" y="460" fill="#98a3ad" font-size="12.5" font-family="-apple-system, sans-serif">• 1-click mood check-in &amp; rumination flags (over-reviewing,</text>
  <text x="58" y="482" fill="#98a3ad" font-size="12.5" font-family="-apple-system, sans-serif">  worry loops, self-attack, guilt spirals)</text>
  <text x="58" y="506" fill="#98a3ad" font-size="12.5" font-family="-apple-system, sans-serif">• Gentle pause prescriptions + 4-7-8 breathing pacer</text>
  <text x="58" y="532" fill="#7db4a6" font-size="11.5" font-family="-apple-system, sans-serif">Interrupt inner friction without toxic positivity.</text>

  <rect x="570" y="402" width="514" height="148" rx="14" fill="#1c2227" stroke="#2f3843"/>
  <text x="592" y="434" fill="#eef1ec" font-size="15.5" font-weight="700" font-family="-apple-system, sans-serif">4. 📝 Obsidian Vault &amp; Local Archive</text>
  <text x="592" y="460" fill="#98a3ad" font-size="12.5" font-family="-apple-system, sans-serif">• Live Markdown preview with clean YAML frontmatter</text>
  <text x="592" y="484" fill="#98a3ad" font-size="12.5" font-family="-apple-system, sans-serif">• 1-click Copy / Daily .md / 7-Day Weekly Summary export</text>
  <text x="592" y="508" fill="#98a3ad" font-size="12.5" font-family="-apple-system, sans-serif">• 100% localStorage + JSON backup/restore + JSON Schema</text>
  <text x="592" y="532" fill="#7db4a6" font-size="11.5" font-family="-apple-system, sans-serif">Zero cloud, zero telemetry, zero dependencies · MIT</text>
</svg>
