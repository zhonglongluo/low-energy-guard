  <circle cx="194" cy="458" r="4.5" fill="#7db4a6"/>
  <circle cx="258" cy="420" r="4.5" fill="#7db4a6"/>
  <circle cx="322" cy="435" r="4.5" fill="#7db4a6"/>
  <circle cx="386" cy="405" r="4.5" fill="#7db4a6"/>
  <circle cx="450" cy="418" r="5" fill="#ffd08a"/>
  <text x="58" y="504" fill="#98a3ad" font-size="12" font-family="-apple-system, sans-serif">Built-in 4-7-8 Breathing Pacer · Brain Dump Parking Lot · JSON Backup</text>

