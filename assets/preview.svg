  <text x="566" y="174" fill="#a9dfd0" font-size="13.5" font-weight="600" font-family="-apple-system, sans-serif">☑ Drink 300ml warm water &amp; stretch shoulders</text>
  <text x="566" y="194" fill="#98a3ad" font-size="11.5" font-family="-apple-system, sans-serif">Baseline · 🥄 1 Spoon · Completed</text>

  <rect x="548" y="218" width="514" height="92" rx="10" fill="#242b33" stroke="#37424f"/>
  <text x="566" y="244" fill="#eef1ec" font-size="13.5" font-weight="600" font-family="-apple-system, sans-serif">☐ Draft 1 section of weekly notes (with Micro-Steps)</text>
  <text x="582" y="268" fill="#a9dfd0" font-size="12" font-family="-apple-system, sans-serif">☑ Open document &amp; write title only</text>
  <text x="582" y="288" fill="#98a3ad" font-size="12" font-family="-apple-system, sans-serif">☐ Jot 3 rough bullets (no perfectionism) · 🥄 2 Spoons</text>

  <rect x="548" y="322" width="514" height="56" rx="10" fill="#20332f" stroke="#5a9b8b"/>
  <text x="566" y="346" fill="#a9dfd0" font-size="13" font-weight="600" font-family="-apple-system, sans-serif">🔋 Energy Recharge Actions (+1 / +2 Spoons)</text>
  <text x="566" y="366" fill="#98a3ad" font-size="11.5" font-family="-apple-system, sans-serif">15-min rest (+2) · 4-7-8 breathing (+1) · Step outside for daylight (+1)</text>

  <rect x="548" y="392" width="514" height="110" rx="10" fill="#242b33" stroke="#2f3843"/>
  <text x="566" y="418" fill="#eef1ec" font-size="13.5" font-weight="600" font-family="-apple-system, sans-serif">🧠 Brain Dump Parking Lot (Zero Distraction)</text>
  <text x="566" y="442" fill="#98a3ad" font-size="12" font-family="-apple-system, sans-serif">Park sudden intrusive thoughts in 1 click without derailing your current</text>
  <text x="566" y="462" fill="#98a3ad" font-size="12" font-family="-apple-system, sans-serif">micro-task — promote to a task later when you have spoons.</text>
  <text x="566" y="488" fill="#7db4a6" font-size="11.5" font-family="-apple-system, sans-serif">100% Offline · Zero Dependencies · Obsidian Markdown Export · MIT</text>
